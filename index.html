<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071a31" />
    <meta name="description" content="内言英語化プロジェクト。画像から読み取った一文を英語で振り返る備忘録です。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=19" />
    <title>備忘録</title>
  </head>
  <body>
    <header class="hero">
      <div class="hero-art" aria-hidden="true"></div>
      <div class="hero-copy">
        <h1>備忘録</h1>
        <p class="hero-subtitle">内言英語化プロジェクト</p>
        <button class="install-button" id="install-button" type="button" hidden>アプリをインストール</button>
      </div>
    </header>

    <main>
      <div class="screen-switch" role="tablist" aria-label="表示画面">
        <button class="screen-tab active" id="practice-screen-tab" type="button" role="tab" aria-selected="true" aria-controls="practice-screen">練習</button>
        <button class="screen-tab" id="library-screen-tab" type="button" role="tab" aria-selected="false" aria-controls="library-screen">格言一覧 <span id="library-count"></span></button>
      </div>

      <section class="practice" id="practice-screen" aria-label="格言の練習" role="tabpanel" aria-labelledby="practice-screen-tab">
        <p class="total-count collection-count" id="total-count">読み込み中</p>

        <div class="mode-switch" role="tablist" aria-label="練習方法">
          <button class="mode-tab active" data-mode="random" role="tab" aria-selected="true">ランダム</button>
          <button class="mode-tab" data-mode="topic" role="tab" aria-selected="false">トピック別</button>
        </div>

        <div class="random-picker" id="random-picker">
          <div><strong>ランダムに練習</strong><p class="hint">画像から読み取った一文をランダムに連続再生します。</p></div>
          <button id="random-play" class="button button-dark" type="button">ランダム再生</button>
        </div>

        <div class="topic-picker" id="topic-picker" hidden>
          <label for="topic-select">テーマを選ぶ</label>
          <div class="topic-row"><select id="topic-select"></select><button id="topic-play" class="button button-dark" type="button">このテーマを連続再生</button></div>
          <p class="hint" id="topic-count"></p>
        </div>

        <article class="quote-card" aria-live="polite">
          <div class="quote-meta"><span id="mode-label">RANDOM PRACTICE</span><span id="item-number">—</span></div>
          <p class="topic-label" id="item-topic"></p>
          <div class="english-wrap" id="english-wrap">
            <p class="english-quote" id="english-quote">読み込み中…</p>
            <p class="english-japanese" id="english-japanese"></p>
            <span class="level-label">CEFR B2</span>
          </div>
          <p class="source-page" id="source-page"></p>
          <div class="card-actions">
            <button id="speak-button" class="button button-primary" type="button"><span aria-hidden="true">▶</span> Gemini音声を再生</button>
            <label class="speed-control" for="model-speed">モデル音声の速度<select id="model-speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2.0×</option></select></label>
            <label class="repeat-control" for="repeat-twice"><input id="repeat-twice" type="checkbox" />連続再生で各格言を2回読む</label>
            <button id="pause-button" class="button button-outline" type="button" disabled>一時停止</button>
            <button id="model-loop-button" class="button button-outline" type="button">モデル音声を連続再生</button>
            <button id="previous-button" class="button button-quiet" type="button" disabled>前の一文 <span aria-hidden="true">←</span></button>
            <button id="next-button" class="button button-quiet" type="button">別の一文 <span aria-hidden="true">→</span></button>
          </div>
          <p class="speech-status" id="speech-status" aria-live="polite"></p>
          <div class="series-bar" id="series-bar" hidden>
            <span id="series-status">連続再生</span>
            <button id="series-stop" class="text-button" type="button">停止</button>
          </div>
        </article>

        <section class="recording" aria-labelledby="recording-title">
          <div class="record-copy"><p class="section-kicker">YOUR VOICE, ON THIS DEVICE</p><h3 id="recording-title">自分の発音を残す</h3><p>録音はこの端末のブラウザ内だけに保存されます。</p></div>
          <div class="record-actions"><button id="record-button" class="button button-outline" type="button">録音を開始</button><button id="record-play-all" class="button button-quiet" type="button" disabled>録音を連続再生 <span id="record-count"></span></button></div>
          <p class="record-status" id="record-status" aria-live="polite">この一文の録音はまだありません。</p>
          <div id="record-list" class="record-list"></div>
        </section>
      </section>

      <section class="library-screen" id="library-screen" aria-label="格言一覧" role="tabpanel" aria-labelledby="library-screen-tab" hidden>
        <div class="library-heading">
          <div><p class="section-kicker">ALL MAXIMS</p><h2>格言一覧</h2></div>
          <p class="library-count" id="library-result-count" aria-live="polite"></p>
        </div>
        <label class="library-search-label" for="library-search">番号・テーマ・日本語・英語で検索</label>
        <input class="library-search" id="library-search" type="search" placeholder="例：179、表現と学習、writing" autocomplete="off" />
        <ol class="library-list" id="library-list"></ol>
        <p class="library-empty" id="library-empty" hidden>一致する格言がありません。</p>
      </section>

    </main>
    <script src="data.js?v=33"></script>
    <script src="app.js?v=32"></script>
  </body>
</html>
